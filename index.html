
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandel Connect</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #174d32;
}

header {
  background: #14532d;
  color: white;
  padding: 25px 12px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 10px 0 0;
  font-size: 16px;
}

.welcome {
  text-align: center;
  padding: 25px 12px;
}

.welcome h2 {
  font-size: 27px;
  margin-bottom: 10px;
}

.welcome p {
  font-size: 16px;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 10px 15px 25px;
}

.actions a {
  background: #198754;
  color: white;
  text-decoration: none;
  padding: 14px 28px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
}

.actions a:hover {
  background: #14532d;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
  padding: 12px;
}

.item {
  border: 1px solid #b7dfc5;
  border-radius: 12px;
  padding: 25px 8px;
  text-align: center;
  color: #14532d;
  background: white;
  font-size: 17px;
  font-weight: bold;
}

.item span {
  display: block;
  font-size: 32px;
  margin-bottom: 10px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #47745a;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🌿 BANDEL CONNECT</h1>
  <p>Apna gaon, apne log, apni community.</p>
</header>

<section class="welcome">
  <h2>Welcome to Bandel</h2>
  <p>Connect with your village and your people.</p>
</section>

<div class="actions">
  <a href="register.html">Register</a>
  <a href="login.html">Login</a>
</div>

<main class="grid">

  <div class="item">
    <span>📰</span>
    News
  </div>

  <div class="item">
    <span>📸</span>
    Photos
  </div>

  <div class="item">
    <span>🎥</span>
    Videos
  </div>

  <div class="item">
    <span>🎉</span>
    Events
  </div>

  <div class="item">
    <span>💼</span>
    Village Jobs
  </div>

  <div class="item">
    <span>💬</span>
    Chat
  </div>

  <div class="item">
    <span>🏪</span>
    Local Business
  </div>

  <div class="item">
    <span>🛒</span>
    Buy & Sell
  </div>

  <div class="item">
    <span>👤</span>
    My Profile
  </div>

  <div class="item">
    <span>🌐</span>
    English & Odia
  </div>

</main>

<footer>
  © 2026 Bandel Connect
  <p>Made with ❤️ for Bandel</p>
</footer>

</body>
</html>
