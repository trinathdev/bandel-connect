
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandel Connect - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:white;color:#14532d;margin:0;padding:20px}
.container{max-width:430px;margin:35px auto;padding:22px;border:1px solid #b7dfc5;border-radius:14px}
header{text-align:center;background:#14532d;color:white;padding:15px;border-radius:10px}
input,button{width:100%;padding:14px;margin:10px 0;border:1px solid #b7dfc5;border-radius:8px;font-size:16px}
button{background:#198754;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5}
label{font-weight:bold}
#status{font-weight:bold;overflow-wrap:anywhere;line-height:1.5}
</style>
</head>
<body>

<div class="container">
<header>
<h2>🌿 BANDEL CONNECT</h2>
<p>Welcome Back!</p>
</header>

<h2>Login with Email OTP</h2>

<label>Email Address</label>
<input id="email" type="email" required placeholder="Enter registered email">

<button id="sendOtp">Send Login OTP</button>

<label>Enter 6-Digit OTP</label>
<input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter OTP">

<button id="verifyOtp">Verify & Login</button>

<p id="status"></p>

<p>New to Bandel Connect?</p>
<a href="register.html">Create Account</a>
<br><br>
<a href="index.html">Back to Home</a>
</div>

<script>
const SUPABASE_URL = "https://khehpylzvawykhqypuhe.supabase.co";
const SUPABASE_KEY = "sb_publishable_4wYsvToMqPcuU9kEOqI23Q_06yUCIf0";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusBox = document.getElementById("status");
const sendButton = document.getElementById("sendOtp");
const verifyButton = document.getElementById("verifyOtp");

function message(text) {
  statusBox.textContent = text;
}

sendButton.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    message("Please enter your registered email.");
    return;
  }

  try {
    sendButton.disabled = true;
    message("Sending login OTP...");

    const { error } = await db.auth.signInWithOtp({
      email: email,
      options: {
        shouldCreateUser: false
      }
    });

    if (error) throw error;

    message("OTP sent! Please check your email inbox.");
  } catch (error) {
    message("Login error: " + error.message);
  } finally {
    sendButton.disabled = false;
  }
});

verifyButton.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const token = document.getElementById("otp").value.trim();

  if (!email || token.length !== 6) {
    message("Enter your email and 6-digit OTP.");
    return;
  }

  try {
    verifyButton.disabled = true;
    message("Verifying OTP...");

    const { data, error } = await db.auth.verifyOtp({
      email: email,
      token: token,
      type: "email"
    });

    if (error) throw error;

    if (!data.user) {
      throw new Error("User verification failed.");
    }

    const { data: profile, error: profileError } = await db
      .from("profiles")
      .select("account_status, role")
      .eq("id", data.user.id)
      .maybeSingle();

    if (profileError) throw profileError;

    if (!profile) {
      await db.auth.signOut();
      message("Profile not found. Please contact Admin.");
      return;
    }

    if (profile.account_status === "pending") {
      await db.auth.signOut();
      message("Your account is waiting for Bandel Admin approval.");
      return;
    }

    if (profile.account_status !== "approved") {
      await db.auth.signOut();
      message("Your account is not approved. Please contact Admin.");
      return;
    }

    message("Login successful! Opening Bandel Connect...");

    window.location.href = "index.html";

  } catch (error) {
    message("Login error: " + error.message);
  } finally {
    verifyButton.disabled = false;
  }
});
</script>

</body>
</html>
