
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandel Connect - Register</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
body{font-family:Arial;background:#f5faf5;color:#174d2b;margin:0;padding:20px}
.container{max-width:430px;margin:25px auto;background:white;padding:22px;border-radius:14px;box-shadow:0 2px 12px #0001}
h2{text-align:center;color:#176b35}
input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:9px 0;border:1px solid #b7d8bd;border-radius:8px;font-size:16px}
button{background:#176b35;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5}
.note{font-size:13px;color:#555}
#status{font-weight:bold;color:#176b35;overflow-wrap:anywhere}
</style>
</head>

<body>
<div class="container">

<h2>🌿 BANDEL CONNECT</h2>
<p style="text-align:center">Create Your Account</p>

<form id="registerForm">

<label>Full Name</label>
<input id="fullName" type="text" placeholder="Enter your full name" required>

<label>Mobile Number (with country code)</label>
<input id="phone" type="tel" placeholder="+16505553434" required>

<div id="recaptcha-container"></div>

<button type="button" id="sendOtp">Send OTP</button>

<label>Enter 6-Digit OTP</label>
<input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter OTP" required>

<button type="button" id="verifyOtp">Verify OTP</button>

<label>Village</label>
<input type="text" value="Bandel" readonly>

<label>Choose Language</label>
<select id="language" required>
<option value="English">English</option>
<option value="Odia">Odia</option>
</select>

<label>Profile Photo</label>
<input id="photo" type="file" accept="image/*" required>

<button type="submit" id="submitBtn" disabled>Submit Registration</button>

</form>

<p id="status"></p>

<p class="note">Your account requires Bandel resident verification and Admin approval.</p>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9BELPXhDEwc29aQHC-IqJ2hoB81XedWQ",
  authDomain: "bandel-connect.firebaseapp.com",
  projectId: "bandel-connect",
  storageBucket: "bandel-connect.firebasestorage.app",
  messagingSenderId: "915757312998",
  appId: "1:915757312998:web:dc01a02905e22848f18427"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

let confirmationResult = null;
let phoneVerified = false;
let recaptchaVerifier = null;

const statusBox = document.getElementById("status");

function showStatus(message) {
  statusBox.textContent = message;
}

async function setupRecaptcha() {
  if (!recaptchaVerifier) {
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
      "recaptcha-container",
      { size: "normal" }
    );
  }
  await recaptchaVerifier.render();
}

document.getElementById("sendOtp").addEventListener("click", async () => {
  const phone = document.getElementById("phone").value.trim();

  if (!phone.startsWith("+")) {
    showStatus("Country code ke saath number likhein.");
    return;
  }

  try {
    showStatus("Please wait...");
    await setupRecaptcha();

    confirmationResult = await auth.signInWithPhoneNumber(
      phone,
      recaptchaVerifier
    );

    showStatus("OTP request successful. Enter your test code.");
  } catch (error) {
    showStatus("Error: " + error.message);

    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }
  }
});

document.getElementById("verifyOtp").addEventListener("click", async () => {
  const code = document.getElementById("otp").value.trim();

  if (!confirmationResult) {
    showStatus("Pehle Send OTP dabayein.");
    return;
  }

  if (code.length !== 6) {
    showStatus("6-digit code enter karein.");
    return;
  }

  try {
    await confirmationResult.confirm(code);

    phoneVerified = true;
    document.getElementById("phone").readOnly = true;
    document.getElementById("submitBtn").disabled = false;

    showStatus("Phone number verified successfully!");
  } catch (error) {
    showStatus("Verification failed: " + error.message);
  }
});

document.getElementById("registerForm").addEventListener("submit", (event) => {
  event.preventDefault();

  if (!phoneVerified) {
    showStatus("Pehle phone number verify karein.");
    return;
  }

  if (!document.getElementById("photo").files.length) {
    showStatus("Profile photo select karein.");
    return;
  }

  showStatus("Phone verified! Profile database aur Admin approval abhi connect nahi hue hain.");
});
</script>

</body>
</html>
