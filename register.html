
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandel Connect - Registration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:white;color:#14532d;margin:0;padding:20px}
.container{max-width:430px;margin:25px auto;padding:22px;border:1px solid #b7dfc5;border-radius:14px}
header{text-align:center;background:#14532d;color:white;padding:15px;border-radius:10px}
input,select,button{width:100%;padding:14px;margin:9px 0;border:1px solid #b7dfc5;border-radius:8px;font-size:16px}
button{background:#198754;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
label{font-weight:bold}
#status{font-weight:bold;overflow-wrap:anywhere}
.note{background:#e9f7ee;padding:12px;border-radius:8px;line-height:1.5}
</style>
</head>
<body>

<div class="container">
<header>
<h2>🌿 BANDEL CONNECT</h2>
<p>Apna gaon, apne log, apni community.</p>
</header>

<h2>Create Account</h2>

<form id="registerForm">
<label>Full Name</label>
<input id="fullName" type="text" required placeholder="Enter your full name">

<label>Email Address</label>
<input id="email" type="email" required placeholder="Enter your email">

<button type="button" id="sendOtp">Send Email OTP</button>

<label>Enter 6-Digit OTP</label>
<input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter OTP">

<button type="button" id="verifyOtp">Verify OTP</button>

<label>Village</label>
<input type="text" value="Bandel" readonly>

<label>Choose Language</label>
<select id="language">
<option value="en">English</option>
<option value="or">Odia</option>
</select>

<button type="submit" id="submitBtn" disabled>
Complete Registration
</button>
</form>

<p id="status"></p>

<div class="note">
Your account will remain pending until an Admin verifies that you are a resident of Bandel village.
</div>

<p>Already registered? <a href="login.html">Login here</a></p>
</div>

<script>
const SUPABASE_URL = "https://khehpylzvawykhqypuhe.supabase.co";
const SUPABASE_KEY = "sb_publishable_4wYsvToMqPcuU9kEOqI23Q_06yUCIf0";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let verifiedUser = null;

const statusBox = document.getElementById("status");
const sendButton = document.getElementById("sendOtp");
const verifyButton = document.getElementById("verifyOtp");
const submitButton = document.getElementById("submitBtn");

function message(text) {
  statusBox.textContent = text;
}

sendButton.addEventListener("click", async () => {
  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();

  if (!fullName || !email) {
    message("Please enter your name and email.");
    return;
  }

  try {
    sendButton.disabled = true;
    message("Sending OTP...");

    const { error } = await db.auth.signInWithOtp({
      email: email,
      options: {
        data: {
          full_name: fullName,
          village: "Bandel",
          language: document.getElementById("language").value
        }
      }
    });

    if (error) throw error;

    message("OTP sent! Please check your email inbox.");
  } catch (error) {
    message("Error: " + error.message);
  } finally {
    sendButton.disabled = false;
  }
});

verifyButton.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const token = document.getElementById("otp").value.trim();

  if (!email || token.length !== 6) {
    message("Enter your email and 6-digit OTP.");
    return;
  }

  try {
    verifyButton.disabled = true;
    message("Verifying OTP...");

    const { data, error } = await db.auth.verifyOtp({
      email: email,
      token: token,
      type: "email"
    });

    if (error) throw error;

    verifiedUser = data.user;

    if (!verifiedUser) {
      throw new Error("User verification failed.");
    }

    const { data: profile, error: profileError } = await db
      .from("profiles")
      .select("account_status, role")
      .eq("id", verifiedUser.id)
      .maybeSingle();

    if (profileError) throw profileError;

    if (!profile) {
      throw new Error("Profile not found. Please contact Admin.");
    }

    document.getElementById("email").readOnly = true;
    submitButton.disabled = false;

    message("Email verified! Your profile is ready. Complete registration below.");

  } catch (error) {
    message("Verification error: " + error.message);
  } finally {
    verifyButton.disabled = false;
  }
});

document.getElementById("registerForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!verifiedUser) {
    message("Please verify your email first.");
    return;
  }

  try {
    submitButton.disabled = true;

    const { data: profile, error } = await db
      .from("profiles")
      .select("account_status")
      .eq("id", verifiedUser.id)
      .single();

    if (error) throw error;

    if (profile.account_status === "approved") {
      message("Your account is already approved. Please login.");
    } else if (profile.account_status === "pending") {
      message("Registration successful! Your account is waiting for Admin approval.");
    } else {
      message("Your account was not approved. Please contact Admin.");
    }

  } catch (error) {
    message("Error: " + error.message);
    submitButton.disabled = false;
  }
});
</script>

</body>
</html>
